<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Hubble</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-body">
  <header class="admin-header">
    <div class="admin-brand">
      <div class="auth-logo" style="width:40px;height:40px;margin:0;border-radius:10px;">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="#fff" d="M12 2.2A9.8 9.8 0 0 0 8.9 21.3c.49.09.67-.21.67-.47v-1.84c-2.73.59-3.3-1.16-3.3-1.16-.45-1.13-1.09-1.43-1.09-1.43-.89-.61.07-.6.07-.6.99.07 1.5 1.01 1.5 1.01.88 1.5 2.3 1.07 2.86.82.09-.64.34-1.07.62-1.32-2.18-.25-4.47-1.09-4.47-4.85 0-1.07.38-1.95 1.01-2.64-.1-.25-.44-1.25.1-2.6 0 0 .83-.27 2.71 1.01a9.4 9.4 0 0 1 4.94 0c1.88-1.28 2.7-1.01 2.7-1.01.54 1.35.2 2.35.1 2.6.63.69 1.01 1.57 1.01 2.64 0 3.77-2.3 4.6-4.49 4.84.35.31.67.91.67 1.84v2.73c0 .26.18.57.68.47A9.8 9.8 0 0 0 12 2.2z"/></svg>
      </div>
      <div>
        <h1 style="font-size:20px;letter-spacing:2px;margin:0;">HUBBLE ADMIN</h1>
        <p class="muted" style="margin:2px 0 0;font-size:12px;" id="adminWho"></p>
      </div>
    </div>
    <div class="admin-actions">
      <a class="ghost-btn" href="/">← Back to app</a>
      <a class="ghost-btn" href="/auth/logout">Sign out</a>
    </div>
  </header>

  <main class="admin-main">
    <section class="kpis" id="kpis"></section>

    <section class="card">
      <div class="card-head"><h2>Access requests</h2><span class="muted" id="usersMeta"></span></div>
      <div class="table-wrap"><table id="usersTable"><thead><tr>
        <th>User</th><th>Status</th><th>Requested</th><th>Last login</th><th>Actions</th>
      </tr></thead><tbody id="usersBody"></tbody></table></div>
    </section>

    <section class="card">
      <div class="card-head"><h2>Usage</h2><span class="muted">per user</span></div>
      <div class="table-wrap"><table id="usageTable"><thead><tr>
        <th>User</th><th>Total events</th><th>Chats</th><th>Last active</th>
      </tr></thead><tbody id="usageBody"></tbody></table></div>
    </section>

    <section class="card">
      <div class="card-head"><h2>Recent activity</h2></div>
      <div class="feed" id="feed"></div>
    </section>
  </main>

  <div class="toast" id="toast"></div>
  <script src="admin.js"></script>
</body>
</html>
