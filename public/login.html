<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Hubble</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <div class="auth-card">
    <div class="auth-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="40" height="40"><path fill="#fff" d="M12 2.2A9.8 9.8 0 0 0 8.9 21.3c.49.09.67-.21.67-.47v-1.84c-2.73.59-3.3-1.16-3.3-1.16-.45-1.13-1.09-1.43-1.09-1.43-.89-.61.07-.6.07-.6.99.07 1.5 1.01 1.5 1.01.88 1.5 2.3 1.07 2.86.82.09-.64.34-1.07.62-1.32-2.18-.25-4.47-1.09-4.47-4.85 0-1.07.38-1.95 1.01-2.64-.1-.25-.44-1.25.1-2.6 0 0 .83-.27 2.71 1.01a9.4 9.4 0 0 1 4.94 0c1.88-1.28 2.7-1.01 2.7-1.01.54 1.35.2 2.35.1 2.6.63.69 1.01 1.57 1.01 2.64 0 3.77-2.3 4.6-4.49 4.84.35.31.67.91.67 1.84v2.73c0 .26.18.57.68.47A9.8 9.8 0 0 0 12 2.2z"/></svg>
    </div>
    <h1>HUBBLE</h1>
    <p class="tag">Your AI GitHub sales coach</p>
    <p class="blurb">Sign in with your GitHub account to request access. New users are reviewed by an admin before the tool unlocks.</p>

    <a class="gh-btn" href="/auth/login">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2.2A9.8 9.8 0 0 0 8.9 21.3c.49.09.67-.21.67-.47v-1.84c-2.73.59-3.3-1.16-3.3-1.16-.45-1.13-1.09-1.43-1.09-1.43-.89-.61.07-.6.07-.6.99.07 1.5 1.01 1.5 1.01.88 1.5 2.3 1.07 2.86.82.09-.64.34-1.07.62-1.32-2.18-.25-4.47-1.09-4.47-4.85 0-1.07.38-1.95 1.01-2.64-.1-.25-.44-1.25.1-2.6 0 0 .83-.27 2.71 1.01a9.4 9.4 0 0 1 4.94 0c1.88-1.28 2.7-1.01 2.7-1.01.54 1.35.2 2.35.1 2.6.63.69 1.01 1.57 1.01 2.64 0 3.77-2.3 4.6-4.49 4.84.35.31.67.91.67 1.84v2.73c0 .26.18.57.68.47A9.8 9.8 0 0 0 12 2.2z"/></svg>
      Sign in with GitHub
    </a>

    <div class="dev-panel" id="devPanel" hidden>
      <div class="dev-divider"><span>dev mode — no OAuth App yet</span></div>
      <p class="dev-note">Simulate a GitHub sign-in to test the access flow. (Disabled once real OAuth credentials are set.)</p>
      <form id="devForm">
        <input id="devLogin" type="text" placeholder="GitHub username (e.g. jonnychipz)" autocomplete="off" />
        <button type="submit">Continue →</button>
      </form>
      <div class="dev-err" id="devErr"></div>
    </div>
  </div>

  <script>
    // Only reveal the dev-login panel if the SERVER is actually in dev mode
    // (no real OAuth App configured). In production it stays hidden.
    fetch("/api/authmode").then((r) => r.json()).then((m) => {
      if (m.devMode) document.getElementById("devPanel").hidden = false;
    }).catch(() => {});
    document.getElementById("devForm")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const login = document.getElementById("devLogin").value.trim();
      const err = document.getElementById("devErr");
      err.textContent = "";
      const res = await fetch("/auth/dev", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ login }),
      });
      const data = await res.json();
      if (!res.ok) { err.textContent = data.error || "Sign-in failed"; return; }
      location.href = data.status === "approved" ? "/" : "/pending";
    });
  </script>
</body>
</html>
