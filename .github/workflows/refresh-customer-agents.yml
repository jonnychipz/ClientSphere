name: Refresh customer intelligence

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch governed production refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f refresh_customer_agents=true
