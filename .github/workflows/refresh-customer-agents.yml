name: Refresh customer intelligence

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: clientsphere-production
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - run: npm ci

      - name: Load infrastructure outputs
        shell: bash
        run: |
          outputs=$(az deployment group show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name clientsphere-main \
            --query properties.outputs -o json)
          echo "PROJECT_ENDPOINT=$(jq -r '.projectEndpoint.value' <<< "$outputs")" >> "$GITHUB_ENV"
          echo "CUSTOMER_AGENT_METADATA_BLOB_URL=$(jq -r '.metadataBlobUrl.value' <<< "$outputs")" >> "$GITHUB_ENV"

      - run: npm run customers:refresh
      - run: npm run agents:provision

      - name: Restart application to load refreshed metadata
        run: az webapp restart --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AZURE_WEBAPP_NAME }}"
