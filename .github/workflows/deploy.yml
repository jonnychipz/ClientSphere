name: Validate and deploy ClientSphere

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_customer_agents:
        description: Refresh public research and Foundry agents
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: clientsphere-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: az bicep build --file infra/main.bicep

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ steps.outputs.outputs.app_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Provision Azure infrastructure
        shell: bash
        env:
          CUSTOM_AVATAR_ENABLED: ${{ vars.CUSTOM_AVATAR_ENABLED || 'false' }}
          CUSTOM_AVATAR_LABEL: ${{ vars.CUSTOM_AVATAR_LABEL || 'Custom presenter' }}
          CUSTOM_AVATAR_GENDER: ${{ vars.CUSTOM_AVATAR_GENDER || 'male' }}
          CUSTOM_BODY_CHARACTER: ${{ vars.CUSTOM_BODY_CHARACTER || 'harry' }}
          CUSTOM_BODY_STYLE: ${{ vars.CUSTOM_BODY_STYLE || 'business' }}
          CUSTOM_AVATAR_CHARACTER: ${{ vars.CUSTOM_AVATAR_CHARACTER }}
          CUSTOM_AVATAR_STYLE: ${{ vars.CUSTOM_AVATAR_STYLE }}
          CUSTOM_AVATAR_PHOTO_MODEL: ${{ vars.CUSTOM_AVATAR_PHOTO_MODEL }}
          CUSTOM_VOICE_NAME: ${{ vars.CUSTOM_VOICE_NAME }}
          CUSTOM_VOICE_ENDPOINT_ID: ${{ vars.CUSTOM_VOICE_ENDPOINT_ID }}
          CUSTOM_VOICE_PROFILE_ID: ${{ vars.CUSTOM_VOICE_PROFILE_ID }}
          CUSTOM_VOICE_BASE_MODEL: ${{ vars.CUSTOM_VOICE_BASE_MODEL || 'DragonLatestNeural' }}
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          for provider in Microsoft.App Microsoft.ContainerRegistry Microsoft.CognitiveServices Microsoft.Insights Microsoft.KeyVault Microsoft.OperationalInsights Microsoft.Storage; do
            az provider register --namespace "$provider" --wait
          done

          az group create \
            --name "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --location "${{ vars.AZURE_LOCATION }}" \
            --tags application=ClientSphere managedBy=GitHubActions \
            --output none

          if az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            -o json > current-app.json 2> current-app.err; then
            az containerapp update \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
              --set-env-vars CLIENTSPHERE_ACCESS_MUTATIONS_LOCKED=true \
              --output none
            az containerapp show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
              -o json > current-app.json
          elif grep -Eqi 'ResourceNotFound|could not be found|not found' current-app.err; then
            printf '{}' > current-app.json
          else
            cat current-app.err >&2
            exit 1
          fi

          current_image=$(jq -r '.properties.template.containers[0].image // "mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"' current-app.json)

          agent_state=$(jq -r '[.properties.template.containers[0].env[]? | select(.name=="CLIENTSPHERE_AGENT_STATE_B64") | .value][0] // ""' current-app.json)
          echo "PREVIOUS_AGENT_STATE_B64=$agent_state" >> "$GITHUB_ENV"

          jq '.tags // {}' current-app.json > access-state-tags.json

          az deployment group create \
            --name clientsphere-main \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters \
              deploymentPrincipalObjectId="${{ vars.AZURE_CLIENT_OBJECT_ID }}" \
              adminLogins="${{ vars.ADMIN_LOGINS }}" \
              customAvatarEnabled="$CUSTOM_AVATAR_ENABLED" \
              customAvatarLabel="$CUSTOM_AVATAR_LABEL" \
              customAvatarGender="$CUSTOM_AVATAR_GENDER" \
              customBodyCharacter="$CUSTOM_BODY_CHARACTER" \
              customBodyStyle="$CUSTOM_BODY_STYLE" \
              customAvatarCharacter="$CUSTOM_AVATAR_CHARACTER" \
              customAvatarStyle="$CUSTOM_AVATAR_STYLE" \
              customAvatarPhotoModel="$CUSTOM_AVATAR_PHOTO_MODEL" \
              customVoiceName="$CUSTOM_VOICE_NAME" \
              customVoiceEndpointId="$CUSTOM_VOICE_ENDPOINT_ID" \
              customVoiceProfileId="$CUSTOM_VOICE_PROFILE_ID" \
              customVoiceBaseModel="$CUSTOM_VOICE_BASE_MODEL" \
              sessionSecret="${{ secrets.SESSION_SECRET }}" \
              suffix="${{ vars.CLIENTSPHERE_SUFFIX }}" \
              location="${{ vars.AZURE_LOCATION }}" \
              aiLocation="${{ vars.AZURE_AI_LOCATION }}" \
              applicationImage="$current_image" \
              agentStateB64="$agent_state" \
              accessStateTags=@access-state-tags.json \
              accessMutationsLocked=true \
            --output json > deployment.json

      - name: Export deployment outputs
        id: outputs
        shell: bash
        run: |
          echo "PROJECT_ENDPOINT=$(jq -r '.properties.outputs.projectEndpoint.value' deployment.json)" >> "$GITHUB_ENV"
          echo "FOUNDRY_PROJECT_RESOURCE_ID=$(jq -r '.properties.outputs.foundryProjectResourceId.value' deployment.json)" >> "$GITHUB_ENV"
          echo "CONTAINER_APP_NAME=$(jq -r '.properties.outputs.containerAppName.value' deployment.json)" >> "$GITHUB_ENV"
          echo "REGISTRY_NAME=$(jq -r '.properties.outputs.containerRegistryName.value' deployment.json)" >> "$GITHUB_ENV"
          echo "REGISTRY_SERVER=$(jq -r '.properties.outputs.containerRegistryServer.value' deployment.json)" >> "$GITHUB_ENV"
          echo "app_url=$(jq -r '.properties.outputs.containerAppUrl.value' deployment.json)" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Restore previous agent metadata
        shell: bash
        run: |
          if [[ -n "$PREVIOUS_AGENT_STATE_B64" ]]; then
            printf '%s' "$PREVIOUS_AGENT_STATE_B64" | base64 --decode | gzip --decompress > customer-agents.json
          fi

      - name: Decide whether customer agents need refresh
        id: agent_refresh
        shell: bash
        run: |
          changed=false
          base="${{ github.event.before }}"
          if [[ "${{ github.event_name }}" == "push" && -n "$base" && "$base" != "0000000000000000000000000000000000000000" ]]; then
            git fetch --no-tags --depth=1 origin "$base"
            if ! git diff --quiet "$base" "${{ github.sha }}" -- config/customers.json instructions.mjs agent-tooling.mjs use-case-registry.mjs manufacturing-live.mjs webgrounding.mjs scripts/provision-customer-agents.mjs scripts/refresh-customer-content.mjs; then
              changed=true
            fi
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            changed=true
          fi

          requested="${{ github.event.inputs.refresh_customer_agents || 'false' }}"
          if [[ ! -f customer-agents.json || "$changed" == "true" || "$requested" == "true" ]]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh public customer research
        if: steps.agent_refresh.outputs.refresh == 'true'
        run: npm run customers:refresh

      - name: Provision customer agents
        if: steps.agent_refresh.outputs.refresh == 'true'
        run: npm run agents:provision

      - name: Preserve agent metadata
        shell: bash
        run: |
          if [[ ! -s customer-agents.json ]]; then
            echo "customer-agents.json is missing or empty" >&2
            exit 1
          fi
          echo "AGENT_STATE_B64=$(gzip --stdout customer-agents.json | base64 --wrap=0)" >> "$GITHUB_ENV"

      - name: Build application container
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if az acr build \
              --registry "$REGISTRY_NAME" \
              --image "clientsphere:${{ github.sha }}" \
              --file Dockerfile .; then
              exit 0
            fi
            if [[ "$attempt" == "5" ]]; then
              exit 1
            fi
            echo "ACR role propagation pending; retrying in 30 seconds..."
            sleep 30
          done

      - name: Deploy application
        shell: bash
        run: |
          az containerapp registry set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "$CONTAINER_APP_NAME" \
            --server "$REGISTRY_SERVER" \
            --identity system \
            --output none

          for attempt in 1 2 3 4 5; do
            if az containerapp update \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "$CONTAINER_APP_NAME" \
              --image "$REGISTRY_SERVER/clientsphere:${{ github.sha }}" \
              --set-env-vars CLIENTSPHERE_AGENT_STATE_B64="$AGENT_STATE_B64" \
              --output none; then
              exit 0
            fi
            if [[ "$attempt" == "5" ]]; then
              exit 1
            fi
            echo "Container registry pull role pending; retrying in 30 seconds..."
            sleep 30
          done

      - name: Configure GitHub OAuth
        if: env.GH_OAUTH_CLIENT_ID != '' && env.GH_OAUTH_CLIENT_SECRET != ''
        env:
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
        run: |
          az containerapp secret set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "$CONTAINER_APP_NAME" \
            --secrets github-client-secret="$GH_OAUTH_CLIENT_SECRET" \
            --output none
          az containerapp update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "$CONTAINER_APP_NAME" \
            --set-env-vars \
              GITHUB_CLIENT_ID="$GH_OAUTH_CLIENT_ID" \
              GITHUB_CLIENT_SECRET=secretref:github-client-secret \
              AUTH_DEV_MODE=false \
            --output none

      - name: Configure delegated Microsoft Entra access for live Fabric data
        env:
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
        run: |
          if [[ -z "$ENTRA_CLIENT_ID" && -z "$ENTRA_CLIENT_SECRET" ]]; then
            echo "Live Fabric identity is not configured; the base application will remain available."
            exit 0
          fi
          if [[ -z "$ENTRA_CLIENT_ID" || -z "$ENTRA_CLIENT_SECRET" ]]; then
            echo "Live Fabric identity is incomplete. Set both ENTRA_CLIENT_ID and ENTRA_CLIENT_SECRET." >&2
            exit 1
          fi
          az containerapp secret set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "$CONTAINER_APP_NAME" \
            --secrets entra-client-secret="$ENTRA_CLIENT_SECRET" \
            --output none
          az containerapp update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "$CONTAINER_APP_NAME" \
            --set-env-vars \
              ENTRA_TENANT_ID="${{ vars.AZURE_TENANT_ID }}" \
              ENTRA_CLIENT_ID="$ENTRA_CLIENT_ID" \
              ENTRA_CLIENT_SECRET=secretref:entra-client-secret \
            --output none

      - name: Configure optional approval email
        env:
          ACS_CONNECTION_STRING: ${{ secrets.ACS_CONNECTION_STRING }}
          EMAIL_SENDER: ${{ vars.EMAIL_SENDER }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          ADMIN_NAME: ${{ vars.ADMIN_NAME }}
        run: |
          if [[ -z "$ACS_CONNECTION_STRING$EMAIL_SENDER$ADMIN_EMAIL$ADMIN_NAME" ]]; then
            echo "Approval email is not configured; access remains manageable in /admin."
            exit 0
          fi
          if [[ -z "$ACS_CONNECTION_STRING" || -z "$EMAIL_SENDER" || -z "$ADMIN_EMAIL" || -z "$ADMIN_NAME" ]]; then
            echo "Email configuration is incomplete. Set ACS_CONNECTION_STRING, EMAIL_SENDER, ADMIN_EMAIL, and ADMIN_NAME." >&2
            exit 1
          fi
          az containerapp secret set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "$CONTAINER_APP_NAME" \
            --secrets acs-connection-string="$ACS_CONNECTION_STRING" \
            --output none
          az containerapp update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "$CONTAINER_APP_NAME" \
            --set-env-vars \
              ACS_CONNECTION_STRING=secretref:acs-connection-string \
              EMAIL_SENDER="$EMAIL_SENDER" \
              ADMIN_EMAIL="$ADMIN_EMAIL" \
              ADMIN_NAME="$ADMIN_NAME" \
            --output none

      - name: Unlock access governance
        if: always()
        shell: bash
        run: |
          target_app="${CONTAINER_APP_NAME:-${{ vars.AZURE_CONTAINER_APP_NAME }}}"
          for attempt in 1 2 3 4 5; do
            if ! az containerapp update \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "$target_app" \
              --set-env-vars CLIENTSPHERE_ACCESS_MUTATIONS_LOCKED=false \
              --output none; then
              sleep $((attempt * 5))
              continue
            fi
            if ! state=$(az containerapp show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "$target_app" \
              --query "properties.template.containers[0].env[?name=='CLIENTSPHERE_ACCESS_MUTATIONS_LOCKED'].value | [0]" \
              -o tsv); then
              sleep $((attempt * 5))
              continue
            fi
            if [[ "$state" == "false" ]]; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "Access governance remained locked after deployment." >&2
          exit 1

      - name: Smoke test
        shell: bash
        env:
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
        run: |
          url="${{ steps.outputs.outputs.app_url }}/healthz"
          expected_customers=$(jq 'length' config/customers.json)
          expected_modes=$((expected_customers * 5))
          expected_live_agents=$(jq '(.liveManufacturing.agents // {}) | length' customer-agents.json)
          expected_live_orchestrator=$(jq '(.liveManufacturing.orchestrator.agentName // "") != ""' customer-agents.json)
          expected_fabric_auth=false
          if [[ -n "$ENTRA_CLIENT_ID" && -n "$ENTRA_CLIENT_SECRET" ]]; then
            expected_fabric_auth=true
          fi
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$url" | jq -e \
              --argjson customers "$expected_customers" \
              --argjson modes "$expected_modes" \
              --argjson live_agents "$expected_live_agents" \
              --argjson live_orchestrator "$expected_live_orchestrator" \
              --argjson fabric_auth "$expected_fabric_auth" \
              '.status == "ok" and .customers == $customers and .agentsConfigured == $customers and .agentModesConfigured == $modes and .liveFabricAgentsConfigured == $live_agents and .liveOrchestratorConfigured == $live_orchestrator and .fabricAuthConfigured == $fabric_auth' >/dev/null; then
              exit 0
            fi
            sleep 15
          done
          curl --fail --show-error "$url"

      - name: Remove obsolete customer agents
        run: npm run agents:cleanup
