name: Build & Deploy Hubble

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hubble-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Syntax check
        run: |
          node -c server.mjs
          node -c auth.mjs
          node -c store.mjs
          node -c webgrounding.mjs
          node -c public/app.js
          node -c public/admin.js

      - name: Package artifact
        run: |
          zip -r release.zip . \
            -x "*.git*" \
            -x ".github/*" \
            -x "data/*" \
            -x "*.png" \
            -x "*.bak"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hubble-app
          path: release.zip

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: hubble-app

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
